# Force le mode via les compteurs de replicas:
write:
  replicas: 0
read:
  replicas: 0
backend:
  replicas: 0

# Un seul pod Loki (single-binary) + stockage local
singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 10Gi
    storageClass: local-path

# Désactive tout ce qui peut créer d'autres StatefulSets/Deployments
canary:
  enabled: false
test:
  enabled: false
chunksCache:
  enabled: false
resultsCache:
  enabled: false

# Config Loki simple + fix du crash "structured metadata"
loki:
  auth_enabled: false
  limits_config:
    allow_structured_metadata: false

  # Bloc 'storage' attendu par le chart (même en filesystem)
  storage:
    type: filesystem
    bucketNames:
      chunks: chunks
      ruler: ruler
    filesystem:
      chunks_directory: /var/loki/chunks
      rules_directory: /var/loki/rules

  # Schéma v12 + boltdb-shipper (stable pour lab)
  schemaConfig:
    configs:
      - from: "2020-10-24"
        store: boltdb-shipper
        object_store: filesystem
        schema: v12
        index:
          prefix: index_
          period: 24h

  compactor:
    working_directory: /var/loki/boltdb-shipper-compactor
