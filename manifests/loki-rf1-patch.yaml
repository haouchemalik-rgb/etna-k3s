deploymentMode: SingleBinary

canary:
  enabled: false
test:
  enabled: false

singleBinary:
  replicas: 1

loki:
  # we keep auth off and structured metadata off (your current setup)
  auth_enabled: false
  limits_config:
    allow_structured_metadata: false

  # *** Make replication factor explicitly 1 ***
  commonConfig:
    replication_factor: 1

  # Some chart versions still read this ring path – set it too, just in case
  ingester:
    lifecycler:
      ring:
        replication_factor: 1

  # Storage bits you already use (filesystem)
  storage:
    type: filesystem
    bucketNames:
      chunks: chunks
      ruler: ruler
    filesystem:
      chunks_directory: /var/loki/chunks
      rules_directory: /var/loki/rules

  # Schema v12 (boltdb-shipper) you already run
  schemaConfig:
    configs:
      - from: "2020-10-24"
        store: boltdb-shipper
        object_store: filesystem
        schema: v12
        index:
          prefix: index_
          period: 24h
