<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ .Title }} · {{ .Site.Title }}</title>
  <style>
    :root { --bg:#0b1220; --panel:#121a2b; --text:#e7ecf3; --muted:#98a2b3; --link:#7aa2ff; --accent:#1f6feb; }
    *{box-sizing:border-box}
    body{margin:0; font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto; background:var(--bg); color:var(--text);}
    header{padding:18px 24px; background:var(--panel); position:sticky; top:0; z-index:10; box-shadow:0 1px 0 rgba(255,255,255,0.05)}
    header a{color:var(--text); text-decoration:none; font-weight:700}
    main{max-width:1100px; margin:24px auto; padding:0 16px; display:grid; grid-template-columns:260px 1fr; gap:24px}
    nav{background:var(--panel); padding:16px; border-radius:14px; position:sticky; top:76px; height:calc(100vh - 100px); overflow:auto}
    nav a{display:block; color:var(--link); text-decoration:none; padding:8px 6px; border-radius:8px}
    nav a.active, nav a:hover{background:rgba(122,162,255,.1)}
    article{background:var(--panel); padding:24px; border-radius:14px; line-height:1.6}
    pre, code{background:#0a0f1a; color:#e6edf3}
    pre{padding:12px; border-radius:10px; overflow:auto}
    table{width:100%; border-collapse:collapse; margin:12px 0}
    th,td{border:1px solid #1f2a44; padding:8px 10px}
    h1,h2,h3{margin-top:1.2em}
    footer{max-width:1100px; margin:12px auto 40px; color:var(--muted); text-align:center}
  </style>
</head>
<body>
  <header><a href="{{ .Site.BaseURL }}">{{ .Site.Title }}</a></header>
  <main>
    <nav>
      {{ $current := . }}
      {{ range .Site.Sections }}
        <a href="{{ .RelPermalink }}" class="{{ if $current.IsDescendant . }}active{{ end }}">{{ .Title }}</a>
      {{ end }}
    </nav>
    <article>
      {{ block "main" . }}{{ end }}
    </article>
  </main>
  <footer>© {{ now.Year }} – Documentation ISR-CLO4</footer>
</body>
</html>
